name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run host tests
        run: python -m unittest discover -s tools/device -p 'test_*.py' -v

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/hu-wifi-adb-signing"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          value = os.environ.get("RELEASE_KEYSTORE_BASE64", "")
          if not value.strip():
              raise SystemExit("RELEASE_KEYSTORE_BASE64 is empty")
          compact = "".join(value.split())
          try:
              data = base64.b64decode(compact, validate=True)
          except Exception as exc:
              raise SystemExit(f"RELEASE_KEYSTORE_BASE64 is not valid Base64: {exc}")
          if not data:
              raise SystemExit("decoded release keystore is empty")
          path = Path(os.environ["RUNNER_TEMP"]) / "hu-wifi-adb-signing" / "release.jks"
          path.write_bytes(data)
          print(f"restored release keystore: {len(data)} bytes")
          PY

      - name: Build signed APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          HU_ADB_SIGNING_KEY: ${{ runner.temp }}/hu-wifi-adb-signing/release.jks
          HU_ADB_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HU_ADB_SIGNING_KEY_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          HU_ADB_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./build.sh

      - name: Verify and prepare release files
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs out/hu-wifi-adb-v1.apk
          cp out/hu-wifi-adb-v1.apk "hu-wifi-adb-${GITHUB_REF_NAME}.apk"
          sha256sum "hu-wifi-adb-${GITHUB_REF_NAME}.apk" > "hu-wifi-adb-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hu-wifi-adb-${{ github.ref_name }}.apk
            hu-wifi-adb-${{ github.ref_name }}.apk.sha256

